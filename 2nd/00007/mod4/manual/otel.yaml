apiVersion: v1
kind: ServiceAccount
metadata:
  name: o11y-otel
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: o11y-otel-role
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: o11y-otel-binding
subjects:
- kind: ServiceAccount
  name: o11y-otel
  namespace: monitoring
roleRef:
  kind: ClusterRole
  name: o11y-otel-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: o11y-otel-config
  namespace: monitoring
data:
  otel-collector-config.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/monitoring_*/*/*.log]
        include_file_path: true
        operators:
          - type: container
    processors:
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.namespace.name
            - k8s.container.name
            - k8s.pod.uid
    exporters:
      otlphttp/loki:
        endpoint: "http://o11y-loki.monitoring.svc.cluster.local:3100/otlp"
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: o11y-otel
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: o11y-otel
  template:
    metadata:
      labels:
        app: o11y-otel
    spec:
      serviceAccountName: o11y-otel
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.158.0
        args: ["--config=/etc/otelcol/otel-collector-config.yaml"]
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
        - name: varlibdocker
          mountPath: /var/lib/docker/containers
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: o11y-otel-config
      - name: varlogpods
        hostPath:
          path: /var/log/pods
      - name: varlibdocker
        hostPath:
          path: /var/lib/docker/containers
