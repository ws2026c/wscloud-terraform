apiVersion: v1
kind: PersistentVolume
metadata:
  name: o11y-loki-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/loki
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-o11y-loki-0
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: o11y-loki
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3100
    targetPort: 3100
  - name: otlp-http
    port: 4318
    targetPort: 4318
  selector:
    app: o11y-loki
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
      replication_factor: 1
      path_prefix: /tmp/loki
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /tmp/loki/chunks
    limits_config:
      otlp_config:
        experimental_observability_otlp_integration_enabled: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: o11y-loki
  namespace: monitoring
spec:
  serviceName: o11y-loki
  replicas: 1
  selector:
    matchLabels:
      app: o11y-loki
  template:
    metadata:
      labels:
        app: o11y-loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.7.6
        args:
        - -config.file=/etc/loki/loki.yaml
        ports:
        - containerPort: 3100
          name: http
        - containerPort: 4318
          name: otlp-http
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: storage
          mountPath: /tmp/loki
      volumes:
      - name: config
        configMap:
          name: loki-config
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: manual
      resources:
        requests:
          storage: 10Gi
