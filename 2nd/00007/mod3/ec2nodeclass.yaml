apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: skm-app-nodeclass
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: skm-eks-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: skm-eks-cluster
  role: KarpenterNodeRole-skm-eks-cluster
  tags:
    Name: skm-app-nodeclass-node
