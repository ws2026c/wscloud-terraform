apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager-svc.observability.svc.wsc2026.skills.local:9093']

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'kubernetes-nodes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc.wsc2026.skills.local:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: 'node-exporter'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: ['observability']
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app]
          action: keep
          regex: node-exporter
        - source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
          
      - job_name: 'kube-state-metrics'
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: ['kube-system', 'observability']
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          action: keep
          regex: kube-state-metrics
  alert_rules.yml: |
    groups:
    - name: wsc2026-alerts
      rules:
      - alert: PodHighCPU
        expr: sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate) by (pod) > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Pod CPU usage exceeds 80% for 3 minutes"

      - alert: PodHighMemory
        expr: sum(container_memory_working_set_bytes) by (pod) / sum(kube_pod_container_resource_limits{resource="memory"}) by (pod) > 0.9
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Pod Memory usage exceeds 90% for 3 minutes"

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Pod is not ready or CrashLoopBackOff for 3 minutes"

      - alert: HighErrorRate
        expr: (sum(rate(nginx_ingress_controller_requests{status=~"4..|5.."}[1m])) / sum(rate(nginx_ingress_controller_requests[1m]))) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "4xx/5xx error rate exceeds 5% for 1 minute"

      - alert: HighLatency
        expr: sum(rate(alb_response_time_seconds_sum[1m])) / sum(rate(alb_response_time_seconds_count[1m])) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Average response time exceeds 3 seconds for 1 minute"

      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="wsc2026"}[1m]) > 3
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Pod restart count in wsc2026 NS exceeded 3 times in 3 minutes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      nodeSelector:
        wsc2026/node: addon
      containers:
      - name: prometheus
        image: prom/prometheus:v3.13.2
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.retention.time=7d
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: observability
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
  selector:
    app: prometheus