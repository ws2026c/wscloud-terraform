apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: observability
  labels:
    k8s-app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        Scripts_File  script.lua

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_wsc2026_*.log
        Parser            containerd_or_docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

    [FILTER]
        Name          grep
        Match         kube.*
        Exclude       log /health

    [FILTER]
        Name          lua
        Match         kube.*
        script        script.lua
        call          format_log

    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              ap-northeast-2
        log_group_name      /wsc2026/eks/application
        log_stream_prefix   app-
        auto_create_group   true
        log_key             log

  script.lua: |
    function format_log(tag, timestamp, record)
        local log = record["log"]
        if log == nil then
            return -1, 0, 0
        end

        local method = log:match("method=(%S+)")
        local path = log:match("path=(%S+)")
        local status_str = log:match("status=(%S+)")
        local duration = log:match("duration=(%S+)")

        if method and path and status_str and duration then
            local status_num = tonumber(status_str) or 200
            local log_level = "INFO"

            if status_num >= 500 then
                log_level = "ERROR"
            elseif status_num >= 400 then
                log_level = "WARN"
            else
                log_level = "INFO"
            end

            local formatted_log = string.format(
                '%s {"level":"%s", "path":"%s", "status": "%s", "duration": "%s", "method": "%s"}',
                log_level, log_level, path, status_str, duration, method
            )
            
            local new_record = {}
            new_record["log"] = formatted_log
            return 2, timestamp, new_record
        end

        return -1, 0, 0
    end

  parsers.conf: |
    [PARSER]
        Name        containerd_or_docker
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]+) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z